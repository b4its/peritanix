apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Production overrides: pin image tags, raise replicas, point at real domains.
images:
  - name: peritanix-ml
    newTag: "1.0.0"
  - name: peritanix-api
    newTag: "1.0.0"
  - name: peritanix-web
    newTag: "1.0.0"
patches:
  - target: { kind: Deployment, name: ml }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
