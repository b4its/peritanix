# =============================================================================
# Ingress — HTTPS for web + api (needed for PWA camera / WebRTC QR scanning)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dape
  namespace: dape
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["dape.example", "api.dape.example"]
      secretName: dape-tls
  rules:
    - host: dape.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { number: 3000 }
    - host: api.dape.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port: { number: 8080 }
---
# Horizontal Pod Autoscalers for the two stateless compute services.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml
  namespace: dape
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ml }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: dape
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
