# =============================================================================
# Application tier: FastAPI ML engine, Go API, SvelteKit web
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: ml
  namespace: dape
spec:
  selector: { app: ml }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml
  namespace: dape
spec:
  replicas: 2
  selector:
    matchLabels: { app: ml }
  template:
    metadata:
      labels: { app: ml }
    spec:
      containers:
        - name: ml
          image: peritanix-ml:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          env:
            - name: DAPE_ENV
              valueFrom: { configMapKeyRef: { name: dape-config, key: DAPE_ENV } }
            - name: INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: dape-secrets, key: FASTAPI_INTERNAL_TOKEN } }
            - name: MINIO_ENDPOINT
              value: "$(MINIO_HOST):$(MINIO_PORT)"
            - name: MINIO_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: dape-secrets, key: MINIO_ROOT_USER } }
            - name: MINIO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: dape-secrets, key: MINIO_ROOT_PASSWORD } }
            - name: MINIO_BUCKET_RAW
              valueFrom: { configMapKeyRef: { name: dape-config, key: MINIO_BUCKET_RAW } }
            - name: MINIO_HOST
              valueFrom: { configMapKeyRef: { name: dape-config, key: MINIO_HOST } }
            - name: MINIO_PORT
              valueFrom: { configMapKeyRef: { name: dape-config, key: MINIO_PORT } }
            - name: DAPE_TBASE_C
              valueFrom: { configMapKeyRef: { name: dape-config, key: DAPE_TBASE_C } }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "2", memory: "2Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: dape
spec:
  selector: { app: api }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: dape
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: peritanix-api:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - name: DAPE_ENV
              valueFrom: { configMapKeyRef: { name: dape-config, key: DAPE_ENV } }
            - name: HTTP_PORT
              value: "8080"
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=disable"
            - name: REDIS_ADDR
              value: "$(REDIS_HOST):$(REDIS_PORT)"
            - name: ML_BASE_URL
              value: "http://$(FASTAPI_HOST):$(FASTAPI_PORT)"
            - name: INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: dape-secrets, key: FASTAPI_INTERNAL_TOKEN } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: dape-secrets, key: JWT_SECRET } }
            - name: AUTH_REQUIRED
              valueFrom: { configMapKeyRef: { name: dape-config, key: AUTH_REQUIRED } }
            - name: MINIO_ENDPOINT
              value: "$(MINIO_HOST):$(MINIO_PORT)"
            - name: MINIO_PUBLIC_BASE
              value: "https://cdn.dape.example"
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: dape-config, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: dape-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: dape-config, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: dape-config, key: POSTGRES_PORT } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: dape-config, key: POSTGRES_DB } }
            - name: REDIS_HOST
              valueFrom: { configMapKeyRef: { name: dape-config, key: REDIS_HOST } }
            - name: REDIS_PORT
              valueFrom: { configMapKeyRef: { name: dape-config, key: REDIS_PORT } }
            - name: FASTAPI_HOST
              valueFrom: { configMapKeyRef: { name: dape-config, key: FASTAPI_HOST } }
            - name: FASTAPI_PORT
              valueFrom: { configMapKeyRef: { name: dape-config, key: FASTAPI_PORT } }
            - name: MINIO_HOST
              valueFrom: { configMapKeyRef: { name: dape-config, key: MINIO_HOST } }
            - name: MINIO_PORT
              valueFrom: { configMapKeyRef: { name: dape-config, key: MINIO_PORT } }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "1", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: dape
spec:
  selector: { app: web }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dape
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: peritanix-web:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - name: PUBLIC_API_BASE_URL
              value: "https://api.dape.example"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
